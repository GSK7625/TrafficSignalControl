# Tabular Q-Learning Configuration
algorithm: QLearning
decision_interval: 5.0
min_green: 5.0
max_green: 60.0
yellow_duration: 3.0
all_red_duration: 1.0

hyperparameters:
  learning_rate: 0.1
  gamma: 0.95
  epsilon_start: 1.0
  epsilon_min: 0.05
  epsilon_decay: 0.94
  num_episodes: 60
  seed: 42

discretization:
  max_effective_green: 25.0
  serving_queue_thresholds: [2.0, 8.0]
  waiting_queue_thresholds: [4.0, 15.0, 35.0]

reward:
  name: NegativePressureReward
  scale: 1.0
  pending_weight: 0.5

